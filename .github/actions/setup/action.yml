name: Setup
description: pnpm, Node, git identity and dependencies; optionally the living-architecture tools.

inputs:
  arch-tools:
    description: Install la-arch-check, which the architecture tests run.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    # The version must read the format that living-architecture.yaml records.
    - if: inputs.arch-tools == 'true'
      shell: bash
      run: npm install -g --ignore-scripts living-architecture@0.4.1
    - shell: bash
      run: git config --global user.name ci && git config --global user.email ci@example.com
    - shell: bash
      run: pnpm install --frozen-lockfile
