name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      # la-arch-check (run by the architecture tests) and its TypeScript twin, which is not on npm.
      - run: uv tool install --no-build living-architecture==0.2.3
      - run: |
          twin="$RUNNER_TEMP/living-architecture"
          git init -q "$twin"
          git -C "$twin" fetch -q --depth 1 https://github.com/MotleyAI/living-architecture.git 8b5cdc1e31d113435183a6459a252a843f5d7487 # v0.2.3
          git -C "$twin" checkout -q FETCH_HEAD
          cd "$twin/node"
          npm ci --ignore-scripts
          npm run build
          mkdir "$twin/bin"
          for file in dist/bin/*.js; do ln -s "$PWD/$file" "$twin/bin/$(basename "$file" .js)"; done
          echo "$twin/bin" >> "$GITHUB_PATH"
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # The perf budgets need hardware WebGL, which hosted runners lack; `pnpm test` runs them locally.
      - run: pnpm test:ci
