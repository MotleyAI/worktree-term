name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # tsc, ESLint, la-arch-check, LikeC4 and the structure and dependency rules.
  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          arch-tools: 'true'
      - run: pnpm exec vitest run --project architecture

  vitest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm exec vitest run --project unit --project process --shard=${{ matrix.shard }}/2

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The perf budgets need hardware WebGL, which hosted runners lack; `pnpm test` runs them locally.
      - run: pnpm exec playwright test --project e2e --shard=${{ matrix.shard }}/2
