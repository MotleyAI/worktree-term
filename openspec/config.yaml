schema: spec-driven

context: |
  worktree-term: a worktree-centric terminal manager for coding agents (CLI `wtd`).
  Stack: Node >=20, TypeScript (strict), ESM, pnpm, zod; esbuild bundles the CLI, Vite the web UI.
  Test tiers: Vitest `unit` (src/**/*.test.ts), `process` (test/process), `architecture`
  (test/architecture), Playwright e2e (test/e2e); `test/integration` is opt-in (real SSH).
  `pnpm test` runs every default tier.
  Architecture: architecture/ (LikeC4 model + arc42 principles per node) is normative;
  `la-arch-check` enforces the model as the import law.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
